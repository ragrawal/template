# Copier template configuration for overlaying a house-price ML pipeline onto
# a project already generated by templates/python-project.
#
# This template is never run standalone: it is always run a second time,
# against the output directory of a prior `copier copy templates/python-project
# <dest>` run, e.g.:
#
#   copier copy templates/python-project <dest> --data package_name=house_price
#   copier copy templates/ml <dest>/house_price --trust
#
# It ships no per-tool config, packaging metadata, or package __init__ files:
# those already exist from the python-project run and are left untouched.

_min_copier_version: "9.0.0"

_envops:
  keep_trailing_newline: true
  undefined: jinja2.StrictUndefined

# No {{ package_name }} wrapper folder here (unlike templates/python-project):
# this template's content maps directly onto the destination, which is
# already the generated project's own root.
_answers_file: .answers/.ml.yml

# package_name is never prompted: it is derived from the destination folder's
# own name, so `copier copy templates/ml <dest>/<package_name> --trust` needs
# no --data flags at all. Confirmed usable at the pinned Copier version.
#
# `_copier_conf.dst_path.name` resolves to an empty string when the
# destination argument on the command line is `.`
# (`PurePosixPath(".").name == ""`), which makes Copier silently skip
# rendering every file whose path contains an empty segment - i.e. every
# file under `src/{{ package_name }}/` (estimator.py, schema.py, tasks/)
# vanishes with no error. A Jinja `validator:` can't guard against this: it
# only runs when the question is actually asked (interactively, or via
# --defaults/--data), but `when: false` here is what lets the documented
# flagless invocation work non-interactively at all - making the question
# askable to enable validation breaks that invocation outright ("Interactive
# session required") whenever stdin isn't a TTY. So this is instead detected
# in _tasks below, after rendering, alongside the other prerequisite check.
package_name:
  type: str
  default: "{{ _copier_conf.dst_path.name }}"
  when: false

# _tasks run in order, with cwd already set to the destination:
# 1. Refuse to continue if the destination wasn't generated by
#    templates/python-project (no .answers/.python_project.yml marker).
# 2. Refuse to continue if package_name couldn't be derived from the
#    destination (see the comment on the package_name question above) - this
#    is detected here as src/<package_name>/estimator.py failing to exist,
#    which also happens to catch the same empty-path-segment failure mode
#    for schema.py and tasks/ without needing to separately recompute
#    package_name from the destination path.
#    Both checks run after Copier has already rendered every file (Copier
#    always renders before running _tasks - there is no supported hook that
#    runs shell/file-system checks earlier), so on failure each one deletes
#    every path this template would have added before exiting non-zero,
#    leaving the destination exactly as it was before the run.
# 3. Merge ML runtime dependencies into the existing pyproject.toml/uv.lock.
# 4. Add httpx as a dev dependency: fastapi.testclient.TestClient (used by
#    this template's own tests) requires it, and the base template's dev
#    group (ruff/pyright/pytest/...) has no reason to include it otherwise.
_tasks:
  - >-
    pkg="$(basename "$PWD")";
    cleanup() { rm -rf .answers/.ml.yml .dockerignore docker docs resources webapp
    "src/$pkg/estimator.py" "src/$pkg/schema.py" "src/$pkg/tasks" "tests/$pkg" tests/webapp; };
    if [ ! -f .answers/.python_project.yml ]; then
    echo "ERROR: templates/ml must be run against a destination already generated by templates/python-project (missing .answers/.python_project.yml)" >&2;
    cleanup; exit 1;
    fi
  - >-
    pkg="$(basename "$PWD")";
    cleanup() { rm -rf .answers/.ml.yml .dockerignore docker docs resources webapp
    "src/$pkg/estimator.py" "src/$pkg/schema.py" "src/$pkg/tasks" "tests/$pkg" tests/webapp; };
    if [ -z "$pkg" ] || [ ! -f "src/$pkg/estimator.py" ]; then
    echo "ERROR: src/$pkg/estimator.py was not generated. This usually means package_name could not be derived from the destination during rendering (for example because the destination argument was \".\"). Re-run Copier with an explicit destination directory name, e.g. \`copier copy <src> <dest>/<package_name> --trust\`, or pass --data package_name=<name>." >&2;
    cleanup; exit 1;
    fi
  - "uv add scikit-learn pandas numpy pydantic fastapi uvicorn"
  - "uv add --dev httpx"

_migrations: []
